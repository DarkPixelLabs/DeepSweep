spring.application.name=deepsweep
server.port=8080
# Maximum .git directory size accepted after clone (500 MiB).
deepsweep.max-clone-bytes=524288000

# Scan API security. Set DEEPSWEEP_API_KEY in the deployment environment.
deepsweep.security.api-key=${DEEPSWEEP_API_KEY:}
deepsweep.security.rate-limit.max-requests=${DEEPSWEEP_RATE_LIMIT_MAX_REQUESTS:30}
deepsweep.security.rate-limit.window-seconds=${DEEPSWEEP_RATE_LIMIT_WINDOW_SECONDS:60}
